name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# HEL1 docker runner has the engine socket, not the host filesystem.
# Bind-mount the standing stack so compose runs against /opt/stacks/tablio.hr/web.

jobs:
  deploy:
    name: Deploy production
    runs-on: [self-hosted, linux, x64, tablio, docker]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Guard environment
        env:
          CF_DNS_TOKEN_PRODUCTION: ${{ secrets.CF_DNS_TOKEN_PRODUCTION }}
          CF_DNS_TOKEN_STAGE: ${{ secrets.CF_DNS_TOKEN_STAGE }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
        run: |
          set -euo pipefail
          test -z "${CF_DNS_TOKEN_STAGE:-}" || { echo "production must not read stage DNS token"; exit 1; }
          test -z "${CLOUDFLARE_TUNNEL_ID:-}" || { echo "production must not read stage tunnel id"; exit 1; }
          test -n "${CF_DNS_TOKEN_PRODUCTION}"
      - name: Deploy on HEL1
        env:
          CF_DNS_TOKEN_PRODUCTION: ${{ secrets.CF_DNS_TOKEN_PRODUCTION }}
        run: |
          set -euo pipefail
          unset SSH_AUTH_SOCK || true
          docker run --rm \
            -v /opt/stacks/tablio.hr/web:/opt/stacks/tablio.hr/web \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e CF_DNS_TOKEN_PRODUCTION \
            -w /opt/stacks/tablio.hr/web \
            docker:27-cli \
            sh -ec '
              apk add --no-cache git bash python3 curl >/dev/null
              git config --global --add safe.directory /opt/stacks/tablio.hr/web
              branch="$(git branch --show-current)"
              test "$branch" = "main" || { echo "expected main (got ${branch})"; exit 1; }
              git fetch origin main
              git checkout main
              git pull --ff-only origin main
              ./scripts/cloudflare_dns_upsert.sh
              docker compose up -d --build web
              echo "production deploy finished $(git rev-parse --short HEAD)"
            '
