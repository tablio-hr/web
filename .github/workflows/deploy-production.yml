name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# HEL1 self-hosted runner. Deploys the standing stack in place.
# Does not start compose from the Actions workspace.

jobs:
  deploy:
    name: Deploy production
    runs-on: [self-hosted, linux, x64, tablio, docker]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Guard environment
        env:
          CF_DNS_TOKEN_PRODUCTION: ${{ secrets.CF_DNS_TOKEN_PRODUCTION }}
          CF_DNS_TOKEN_STAGE: ${{ secrets.CF_DNS_TOKEN_STAGE }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
        run: |
          set -euo pipefail
          test -d /opt/stacks/tablio.hr/web
          test -z "${CF_DNS_TOKEN_STAGE:-}" || { echo "production must not read stage DNS token"; exit 1; }
          test -z "${CLOUDFLARE_TUNNEL_ID:-}" || { echo "production must not read stage tunnel id"; exit 1; }
          test -n "${CF_DNS_TOKEN_PRODUCTION}"
      - name: Deploy on HEL1
        env:
          CF_DNS_TOKEN_PRODUCTION: ${{ secrets.CF_DNS_TOKEN_PRODUCTION }}
        run: |
          set -euo pipefail
          unset SSH_AUTH_SOCK || true
          cd /opt/stacks/tablio.hr/web
          export CF_DNS_TOKEN_PRODUCTION
          branch="$(git branch --show-current)"
          [[ "$branch" == "main" ]] || { echo "expected main (got ${branch})"; exit 1; }
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          ./scripts/cloudflare_dns_upsert.sh
          docker compose up -d --build web
          echo "production deploy finished $(git rev-parse --short HEAD)"
